<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>
    <h1>Student Registration Form</h1>
    <form action="/submit" method="post">
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" required><br><br>



        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required><br><br>

        <label for="gender">Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label><br>
        <input type="radio" id="other" name="gender" value="other" required>
        <label for="other">Other</label><br><br>

        <label for="department">Department:</label><br>
        <select id="department" name="department" required>
            <option value="">Select a department</option>
            <option value="computer-science">CSE</option>
            <option value="EEE">EEE</option>
            <option value="BBA">BBA</option>
            <option value="English">English</option>
        </select><br><br>


        <label for="Skills">Skills:</label><br>
        <input type="checkbox" id="HTML" name="skills" value="HTML">
        <label for="HTML">HTML</label><br>
        <input type="checkbox" id="CSS" name="skills" value="CSS">
        <label for="CSS">CSS</label><br>
        <input type="checkbox" id="JavaScript" name="skills" value="JavaScript">
        <label for="JavaScript">JavaScript</label><br>
        <input type="checkbox" id="React" name="skills" value="React">
        <label for="React">React</label><br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="50" required></textarea><br><br>

        <label for="Profile Picture">Profile Picture:</label><br>
        <input type="file" id="Profile Picture" name="profile_picture" accept="image/*" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br>

        <label for="confirm_password">Confirm Password:</label><br>
        <input type="password" id="confirm_password" name="confirm_password" required>
        <br><br>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
